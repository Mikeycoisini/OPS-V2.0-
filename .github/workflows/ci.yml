name: Frontend CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
          cache: npm
      - run: npm ci --registry=https://registry.npmjs.org --replace-registry-host=always
      - run: npm run test:contracts
      - run: npm run build
